<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Tracker</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --primary: #14b8a6;
  --danger: #ef4444;
  --text: #1f2937;
  --muted: #6b7280;
}

body.dark {
  --bg: #020617;
  --card: #0f172a;
  --text: #e5e7eb;
  --muted: #9ca3af;
}

* {
  box-sizing: border-box;
  font-family: Inter, system-ui, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  transition: .3s;
}

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 28px;
  background: var(--card);
  box-shadow: 0 4px 12px rgba(0,0,0,.05);
}

.top-right {
  display: flex;
  align-items: center;
  gap: 18px;
}

/* THEME SWITCH */
.switch {
  width: 42px;
  height: 22px;
  background: #cbd5e1;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
}
.switch::after {
  content: "";
  width: 18px;
  height: 18px;
  background: white;
  position: absolute;
  top: 2px;
  left: 2px;
  border-radius: 50%;
  transition: .3s;
}
body.dark .switch {
  background: var(--primary);
}
body.dark .switch::after {
  left: 22px;
}

/* NOTIFICATIONS */
.notify-btn {
  position: relative;
  cursor: pointer;
  font-size: 20px;
}
.notify-count {
  position: absolute;
  top: -6px;
  right: -8px;
  background: var(--danger);
  color: white;
  font-size: 11px;
  border-radius: 50%;
  padding: 2px 6px;
}

#notifyPanel {
  position: fixed;
  top: 0;
  right: 0;
  width: 300px;
  height: 100vh;
  background: var(--card);
  box-shadow: -6px 0 20px rgba(0,0,0,.2);
  transform: translateX(100%);
  transition: .35s;
  z-index: 1000;
}
#notifyPanel.show {
  transform: translateX(0);
}

.notify-header {
  padding: 16px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #e5e7eb;
}

#notifyList {
  padding: 14px;
  list-style: none;
  margin: 0;
}
#notifyList li {
  background: var(--bg);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 14px;
}

/* OVERLAY */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  z-index: 999;
}
#overlay.show { display: block; }

/* TOAST */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--danger);
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  opacity: 0;
  transform: translateY(20px);
  transition: .3s;
  z-index: 2000;
  display: flex;
  align-items: center;
  gap: 12px;
}
#toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* MAIN */
.container {
  display: flex;
  gap: 28px;
  padding: 28px;
}

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 24px;
  flex: 1;
  transition: .25s;
}
.card:hover {
  transform: translateY(-4px);
}

/* STATS */
.stats {
  display: flex;
  gap: 14px;
  margin: 18px 0;
}
.stat {
  flex: 1;
  padding: 16px;
  border-radius: 14px;
  background: var(--bg);
}
.stat span {
  font-size: 13px;
  color: var(--muted);
}
.stat strong {
  font-size: 20px;
}
.income { border-left: 5px solid #22c55e; }
.expense { border-left: 5px solid #ef4444; }
.savings { border-left: 5px solid #3b82f6; }

/* BAR */
.bar {
  height: 10px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 14px;
}
#barFill {
  height: 100%;
  width: 0%;
  transition: .4s;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  background: transparent;
  color: var(--text);
}
input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(20,184,166,.25);
}

/* BUTTONS */
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}
.add { background: var(--primary); color: white; }

/* COOL BUDGET BUTTON */
.budget-btn {
  background: linear-gradient(135deg,#14b8a6,#22c55e);
  color: white;
  box-shadow: 0 8px 18px rgba(20,184,166,.35);
  transition: .25s;
}
.budget-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 22px rgba(20,184,166,.45);
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
}
tr:hover { background: rgba(20,184,166,.08); }

/* DELETE */
.del-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 16px;
  opacity: .6;
  transition: .15s;
}
.del-btn:hover {
  opacity: 1;
  color: var(--danger);
  transform: scale(1.15);
}
</style>
</head>

<body>

<header class="top-bar">
  <h2>💸 Expense Tracker</h2>
  <div class="top-right">
    <div class="switch" id="themeToggle"></div>
    <div class="notify-btn" id="notifyBtn">🔔
      <span class="notify-count" id="notifyCount">0</span>
    </div>
  </div>
</header>

<div id="overlay"></div>

<div id="notifyPanel">
  <div class="notify-header">
    <strong>Notifications</strong>
    <button onclick="closeNotify()">✕</button>
  </div>
  <ul id="notifyList"></ul>
</div>

<div id="toast"></div>

<div class="container">
  <div class="card">
    <h1 id="balance">₹0</h1>

    <div class="stats">
      <div class="stat income"><span>Income</span><strong>₹<span id="income">0</span></strong></div>
      <div class="stat expense"><span>Expense</span><strong>₹<span id="expense">0</span></strong></div>
      <div class="stat savings"><span>Savings</span><strong>₹<span id="savings">0</span></strong></div>
    </div>

    <div class="bar"><div id="barFill"></div></div>

    <input id="name" placeholder="Income / Expense name">
    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>
    <input id="amount" type="number" placeholder="Amount">
    <input id="limit" type="number" placeholder="Daily Budget">
    <button class="budget-btn" onclick="setBudget()">Set Budget</button>

    <button class="add" onclick="addTransaction()">Add Transaction</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Total</th><th></th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<script>
let transactions = [];
let notifications = [];
let dailyLimit = 0;
let lastDeleted = null;
let undoTimer = null;

const nameEl = document.getElementById("name");
const typeEl = document.getElementById("type");
const amountEl = document.getElementById("amount");
const limitEl = document.getElementById("limit");

const listEl = document.getElementById("list");
const balanceEl = document.getElementById("balance");
const incomeEl = document.getElementById("income");
const expenseEl = document.getElementById("expense");
const savingsEl = document.getElementById("savings");
const barFill = document.getElementById("barFill");

const notifyPanel = document.getElementById("notifyPanel");
const overlay = document.getElementById("overlay");
const notifyCount = document.getElementById("notifyCount");
const notifyList = document.getElementById("notifyList");
const toast = document.getElementById("toast");

document.getElementById("themeToggle").onclick =
  () => document.body.classList.toggle("dark");

document.getElementById("notifyBtn").onclick = () => {
  notifyPanel.classList.add("show");
  overlay.classList.add("show");
};
overlay.onclick = closeNotify;
function closeNotify() {
  notifyPanel.classList.remove("show");
  overlay.classList.remove("show");
}

function setBudget() {
  dailyLimit = Number(limitEl.value) || dailyLimit;
}

function addTransaction() {
  const name = nameEl.value.trim();
  const type = typeEl.value;
  const amount = Number(amountEl.value);

  if (!name || !amount) return;

  transactions.push({ name, type, amount });
  nameEl.value = "";
  amountEl.value = "";

  render();
  checkLimit();
}

function render() {
  listEl.innerHTML = "";
  let income = 0, expense = 0;

  transactions.forEach((t, index) => {
    listEl.innerHTML += `
      <tr>
        <td>${t.name}</td>
        <td style="color:${t.type==="income"?"green":"red"}">
          ${t.type==="income"?"₹":"-₹"}${t.amount}
        </td>
        <td>
          <button class="del-btn" onclick="deleteTransaction(${index})">🗑</button>
        </td>
      </tr>
    `;
    t.type==="income" ? income+=t.amount : expense+=t.amount;
  });

  incomeEl.textContent = income;
  expenseEl.textContent = expense;
  savingsEl.textContent = income - expense;
  balanceEl.textContent = "₹" + (income - expense);

  const spent = expense;
  if (dailyLimit) {
    const percent = Math.min(100, (spent / dailyLimit) * 100);
    barFill.style.width = percent + "%";

    if (percent < 70) {
      barFill.style.background = "linear-gradient(90deg,#22c55e,#14b8a6)";
    } else if (percent < 100) {
      barFill.style.background = "linear-gradient(90deg,#facc15,#f59e0b)";
    } else {
      barFill.style.background = "linear-gradient(90deg,#ef4444,#dc2626)";
    }
  } else {
    barFill.style.width = "0%";
  }
}

function deleteTransaction(index) {
  lastDeleted = { item: transactions[index], index };
  transactions.splice(index, 1);
  render();
  showUndoToast("Transaction deleted");
}

function showUndoToast(msg) {
  toast.innerHTML = `${msg}
    <button onclick="undoDelete()" style="background:none;border:none;color:#fff;font-weight:600;cursor:pointer;">UNDO</button>`;
  toast.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>toast.classList.remove("show"),4000);
}

function undoDelete() {
  if (!lastDeleted) return;
  transactions.splice(lastDeleted.index,0,lastDeleted.item);
  lastDeleted = null;
  toast.classList.remove("show");
  render();
}

function checkLimit() {
  const spent = transactions.filter(t=>t.type==="expense")
    .reduce((a,b)=>a+b.amount,0);

  if (dailyLimit && spent > dailyLimit) {
    showUndoToast("Daily budget exceeded!");
    addNotification("Budget exceeded by ₹" + (spent - dailyLimit));
  }
}

function addNotification(msg) {
  notifications.push(msg);
  notifyCount.textContent = notifications.length;
  const li = document.createElement("li");
  li.textContent = msg;
  notifyList.appendChild(li);
}
</script>

</body>
</html>
